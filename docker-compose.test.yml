# テスト用: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d firestore-emulator
# その後 pytest を実行する（開発用エミュレータとポートを分けて、データが混ざらないようにする）。
services:
  firestore-emulator:
    command: gcloud emulators firestore start --host-port=0.0.0.0:8082
    ports:
      - "8082:8082"

  app:
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8082
