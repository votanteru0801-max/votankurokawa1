services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    restart: unless-stopped
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports:
      - "8081:8081"

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ローカル開発ではFirestore本番ではなくエミュレータを使う
      # （google-cloud-firestoreライブラリがこの環境変数を自動的に見に行く）。
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8081
      GOOGLE_CLOUD_PROJECT: local-dev
    ports:
      - "8080:8080"
    depends_on:
      - firestore-emulator
    volumes:
      - ./:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
